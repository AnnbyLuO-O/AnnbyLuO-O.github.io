<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>\謝謝Esme/</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    @font-face { 
      font-family: 'Cubic 11'; 
      src: url('https://cdn.jsdelivr.net/npm/man-tout-font@1.0.1/font/MTC.woff2') format('woff2'); 
    }

   
    body { 
      font-family: 'Cubic 11', 'Press Start 2P', cursive; 
      background-color: #e8dfc9;         
      color: #3e3a33; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      margin: 0; 
      overflow: hidden; 
      image-rendering: pixelated;
    }

    .container { 
      position: relative; 
      text-align: center; 
      background-color: #f7f3e8;         
      padding: 30px; 
      border-radius: 0; 
      border: 4px solid #5b4f3b;         
      box-shadow: 8px 8px 0px #c4b594;   
      width: 90%; 
      max-width: 450px; 
    }

    #result-container { display: none; }

    h1 { font-size: 22px; line-height: 1.5; color: #5b4f3b; }  
    p { line-height: 1.5; font-size: 14px; }

    input[type="text"] { 
      width: 80%; 
      padding: 10px; 
      margin-bottom: 15px; 
      border: 2px solid #b8a88a; 
      border-radius: 0; 
      font-size: 12px; 
      font-family: 'Cubic 11', 'Press Start 2P', cursive; 
      background-color: #fbf7ef; 
      color: #3e3a33;
    }
    input::placeholder { color: #9f927e; font-size: 9px; }

    button { 
      background-color: #d2b48c;   
      color: #2f2c27; 
      padding: 12px 20px; 
      border: 2px solid #5b4f3b; 
      border-radius: 0; 
      cursor: pointer; 
      font-size: 12px; 
      font-family: 'Cubic 11', 'Press Start 2P', cursive; 
      transition: none; 
    }
    button:hover, button:active { 
      background-color: #e7c9a8; 
      color: #000; 
    }

    
    #code-message-area {
      background-color: #2a2927; 
      color: #d8c7a1;            
      font-family: 'Courier New', Courier, monospace; 
      font-size: 14px;
      text-align: left; 
      padding: 15px; 
      border: 2px solid #5b4f3b;
      min-height: 100px;
      max-height: min(40vh, 260px);
      overflow-y: auto;
      overflow-x: hidden;
      line-height: 1.6; 
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 15px;
      position: relative;
    }

    #code-message-area::-webkit-scrollbar { width: 10px; }
    #code-message-area::-webkit-scrollbar-track { background: #3c3c3c; }
    #code-message-area::-webkit-scrollbar-thumb { background: #9b8b6c; border-radius: 6px; }
    #code-message-area::-webkit-scrollbar-thumb:hover { background: #c3b49a; }

    .typing-cursor {
      display: inline-block;
      background-color: #d8c7a1; 
      width: 8px;
      height: 1.1em;
      margin-left: 1px;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      from, to { background-color: transparent; }
      50% { background-color: #d8c7a1; }
    }

    
    .modal-overlay { 
      position: fixed; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      background-color: rgba(0, 0, 0, 0.55); 
      display: none; 
      justify-content: center; 
      align-items: center; 
      z-index: 1000; 
    }

    .modal-content { 
      background-color: #f7f3e8;
      padding: 25px; 
      border: 4px solid #5b4f3b; 
      text-align: center; 
      box-shadow: 8px 8px 0px #c4b594; 
      width: 90%; 
      max-width: 400px; 
    }

    .modal-content p { 
      font-size: 14px; 
      margin-bottom: 25px; 
      color: #3e3a33; 
    }

    .modal-buttons { 
      display: flex; 
      flex-direction: column;
      gap: 12px;
    }

    .modal-buttons button { 
      width: 100%; 
      padding: 15px 20px; 
      font-size: 10px;
    }

    #confirm-btn { background-color: #d2b48c; }
    #confirm-btn:hover { background-color: #e6c8a3; }

    #cancel-btn { background-color: #c7b08a; }
    #cancel-btn:hover { background-color: #d9c2a1; }

  </style>
</head>

<body>
  <div id="input-container" class="container">
    <h1>For Esme</h1>
    <p>Please enter your name</p>
    <input type="text" id="name-input" placeholder="e.g.Esme, Capitalize the first letter">
    <button onclick="showMessage()">see message</button>
  </div>

  <div id="result-container" class="container">
    <p>Message for you:</p>
    <pre id="code-message-area"></pre>
    <button onclick="resetToStart()">Best regards !</button>
  </div>

  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-content">
      <p id="confirmation-text">This is a confirmation message</p>
      <div class="modal-buttons">
        <button id="confirm-btn" onclick="confirmName()">I've checked it out.</button>
        <button id="cancel-btn" onclick="cancelConfirmation()">My bad. Let me start over.</button>
      </div>
    </div>
  </div>

  <script defer>
    const messages = {
      'Esme': `嗨 ㄟ捨咪
結果我真的就要從這邊畢業咧 !
總是把離職掛在嘴巴的我真的做到了，我覺得我一直都不是只會講講的人喇，就是更新履歷、投履歷我是真的一直都有在做的，只是可能我平常就很愛胡說八道，所以就沒有被當一回事哈哈哈哈哈。

從一開始妳就是我的上載師父，我就是又笨又慢又粗心，但我不管怎麼樣問妳問題妳都超有耐心的，有時候一個問題我甚至問了超多遍，尤其是付費方案露營那些的，真的是搞也搞不懂，然後一路到後來的登山，好像除了在RPA那段時間，其餘的時候都被妳拯救到了。

遇到問題的時候我馬上就是一個慌慌張張，阿妳總是一如往常很冷靜，不管當下我們有沒有一起想到好的解決辦法，我都覺得妳是一個讓我安心的存在呦 !

謝謝一路合作了這麼長的時間，中間如果有讓妳覺得白爛的地方，還請您多多見諒(尤其是管理上載那個時候)，負荷量那些我都是亂算喇，那種數字對我來說真的一點都不重要，還好都一起走過來了。

謝謝阿姊一直以來的照顧，安比我要自己去外面闖盪看看了喲!
祝阿姊接下來一路都順利

P.S.謝謝第一次露營最後姊呼載我去火車站 !`
    };

    let currentName = '';
    let typingInterval = null;

    document.addEventListener('DOMContentLoaded', () => {
      inputContainer = document.getElementById('input-container');
      nameInput = document.getElementById('name-input');
      modalOverlay = document.getElementById('modal-overlay');
      confirmationText = document.getElementById('confirmation-text');
      resultContainer = document.getElementById('result-container');
      codeMessageArea = document.getElementById('code-message-area');
    });

    function showMessage() {
      currentName = nameInput.value;
      if (currentName.trim() === '') { alert('Please enter your name first！'); return; }
      confirmationText.innerText = `Are you sure you are "${currentName}" ?`;
      modalOverlay.style.display = 'flex';
    }

    function cancelConfirmation() {
      modalOverlay.style.display = 'none';
    }

    function confirmName() {
      modalOverlay.style.display = 'none';
      const messageToShow = (currentName in messages) ? messages[currentName] : `Who are you ${currentName}? No message for you.`;
      codeMessageArea.innerHTML = '';
      typeMessage(messageToShow, codeMessageArea);
      inputContainer.style.display = 'none';
      resultContainer.style.display = 'block';
    }

    function typeMessage(message, element) {
      if (typingInterval) { clearInterval(typingInterval); typingInterval = null; }
      let index = 0;
      element.innerHTML = '<span class="typing-cursor"></span>';
      typingInterval = setInterval(() => {
        if (index < message.length) {
          const cursorSpan = element.querySelector('.typing-cursor');
          const charNode = document.createTextNode(message[index]);
          if (cursorSpan) element.insertBefore(charNode, cursorSpan);
          element.scrollTop = element.scrollHeight;
          index++;
        } else {
          clearInterval(typingInterval);
          typingInterval = null;
          element.querySelector('.typing-cursor').remove();
        }
      }, 80);
    }

    function resetToStart() {
      if (typingInterval) { clearInterval(typingInterval); typingInterval = null; }
      resultContainer.style.display = 'none';
      inputContainer.style.display = 'block';
      nameInput.value = '';
      codeMessageArea.innerHTML = '';
    }
  </script>
</body>
</html>

    body {

      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      image-rendering: pixelated;
    }

    .container {
      position: relative;
      text-align: center;
      background-color: #ffffff;
      padding: 30px;
      border-radius: 0;
      border: 4px solid #19a8ff;          
      box-shadow: 8px 8px 0px #00749c;

      max-width: 450px;                   
    }

    #result-container { display: none; }

      font-size: 22px;
      line-height: 1.5;
      color: #004c6b;                      
    }

    p {
      line-height: 1.5;
      font-size: 14px;
    }

    input[type="text"] {
      width: 80%;
      padding: 10px;
      margin-bottom: 15px;
      border: 2px solid #19a8ff;          
      border-radius: 0;
      font-size: 12px;
      font-family: 'Cubic 11', 'Press Start 2P', cursive;
      background-color: #f7fcff;          
      color: #333;
    }
    input::placeholder {
      color: #89bfe8;
      font-size: 9px;
    }

    button {
      background-color: #ffd836;          
      color: #2b2b2b;
      padding: 12px 20px;
      border: 2px solid #19a8ff;          
      border-radius: 0;
      cursor: pointer;
      font-size: 12px;
      font-family: 'Cubic 11', 'Press Start 2P', cursive;
      transition: none;
    }
    button:hover,
    button:active {
      background-color: #ffe772;          
      color: #111;
    }

    #code-message-area {
      background-color: #ffffff;
      color: #304555;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      text-align: left;
      padding: 15px;
      border: 2px solid #19a8ff;
      min-height: 100px;
      max-height: min(40vh, 260px);
      overflow-y: auto;
      overflow-x: hidden;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 15px;
      position: relative;
    }

    #code-message-area::-webkit-scrollbar { width: 10px; }
    #code-message-area::-webkit-scrollbar-track { background: #e0f4ff; }
    #code-message-area::-webkit-scrollbar-thumb { background: #19a8ff; border-radius: 6px; }
    #code-message-area::-webkit-scrollbar-thumb:hover { background: #007ed1; }

    .typing-cursor {
      display: inline-block;
      background-color: #19a8ff;
      width: 8px;
      height: 1.1em;
      margin-left: 1px;
      vertical-align: baseline;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      from, to { background-color: transparent; }
      50% { background-color: #19a8ff; }
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.65);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background-color: #ffffff;
      padding: 25px;
      border-radius: 0;
      border: 4px solid #19a8ff;          
      text-align: center;
      box-shadow: 8px 8px 0px #00749c;    
      width: 90%;
      max-width: 400px;                   
    }

    .modal-content p {
      font-size: 14px;
      margin-bottom: 25px;
      line-height: 1.5;
      color: #304555;
    }

    .modal-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-buttons button {
      width: 100%;
      padding: 15px 20px;
      font-size: 10px;
    }

    #confirm-btn {
      background-color: #ffd836;          
      border-color: #19a8ff;
    }
    #confirm-btn:hover {
      background-color: #ffe772;
    }

    #cancel-btn {
      background-color: #fff3b0;          
      border-color: #19a8ff;
    }
    #cancel-btn:hover {
      background-color: #fff7cc;
    }

    @media (max-width: 500px) {
      .container { width: 85%; padding: 15px; }
      h1 { font-size: 18px; }
      button { padding: 10px 15px; font-size: 11px; }
      #code-message-area { font-size: 12px; min-height: 80px; }
      .modal-content { padding: 20px; max-width: 90%; }
    }
  </style>
</head>

    function typeMessage(message, element) {

      element.innerHTML = '<span class="typing-cursor"></span>';
      typingInterval = setInterval(() => {
        if (index < message.length) {
          const cursorSpan = element.querySelector('.typing-cursor');
          const charNode = document.createTextNode(message[index]);
          if (cursorSpan) element.insertBefore(charNode, cursorSpan);
          element.scrollTop = element.scrollHeight;
          index++;
        } else {
          clearInterval(typingInterval);
          typingInterval = null;
          const cursorSpan = element.querySelector('.typing-cursor');
          if (cursorSpan) cursorSpan.remove();
        }
      }, 80);
    }

    function resetToStart() {

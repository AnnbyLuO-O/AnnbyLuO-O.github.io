<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>\謝謝秋西/</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    @font-face { font-family: 'Cubic 11'; src: url('https://cdn.jsdelivr.net/npm/man-tout-font@1.0.1/font/MTC.woff2') format('woff2'); }

    /* 百變怪紫色主題 */
    body { 
      font-family: 'Cubic 11', 'Press Start 2P', cursive; 
      background-color: #f4edff;      /* 淡紫背景 */
      color: #2f2438; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      margin: 0; 
      overflow: hidden; 
      image-rendering: pixelated; 
    }

    .container { 
      position: relative; 
      text-align: center; 
      background-color: #fcf7ff;      /* 卡片淡紫白 */   
      padding: 30px; 
      border-radius: 0; 
      border: 4px solid #4b3b69;      /* 深紫框 */ 
      box-shadow: 8px 8px 0px #a68adf;/* 紫色陰影 */   
      width: 90%; 
      max-width: 450px; 
    }

    #result-container { display: none; }
    h1 { font-size: 22px; line-height: 1.5; color: #6b4fb0; }  
    p { line-height: 1.5; font-size: 14px; }

    input[type="text"] { 
      width: 80%; 
      padding: 10px; 
      margin-bottom: 15px; 
      border: 2px solid #a68adf; 
      border-radius: 0; 
      font-size: 12px; 
      font-family: 'Cubic 11', 'Press Start 2P', cursive; 
      background-color: #fdf8ff; 
      color: #2f2438;
    }
    input::placeholder { color: #9a8bb5; font-size: 9px; }

    button { 
      background-color: #b58cff;      /* 主按鈕粉紫 */
      color: #22172b; 
      padding: 12px 20px; 
      border: 2px solid #4b3b69; 
      border-radius: 0; 
      cursor: pointer; 
      font-size: 12px; 
      font-family: 'Cubic 11', 'Press Start 2P', cursive; 
      transition: none; 
    }
    button:hover, button:active { 
      background-color: #d0b4ff;      /* hover 淺一階 */
      color: #22172b; 
    }

    #code-message-area {
      background-color: #262133; 
      color: #e2d4ff;              /* 文字淡紫 */ 
      font-family: 'Courier New', Courier, monospace; 
      font-size: 14px;
      text-align: left; 
      padding: 15px; 
      border: 2px solid #4b3b69;
      min-height: 100px;
      max-height: min(40vh, 260px);
      overflow-y: auto;
      overflow-x: hidden;
      line-height: 1.6; 
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 15px;
      position: relative;
    }

    #code-message-area::-webkit-scrollbar { width: 10px; }
    #code-message-area::-webkit-scrollbar-track { background: #3a304a; }
    #code-message-area::-webkit-scrollbar-thumb { background: #a68adf; border-radius: 6px; }
    #code-message-area::-webkit-scrollbar-thumb:hover { background: #d0b4ff; }

    .typing-cursor {
      display: inline-block;
      background-color: #e2d4ff;
      width: 8px;
      height: 1.1em;
      margin-left: 1px;
      vertical-align: baseline;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      from, to { background-color: transparent; }
      50% { background-color: #e2d4ff; }
    }

    /* Modal */
    .modal-overlay { 
      position: fixed; top: 0; left: 0; 
      width: 100%; height: 100%; 
      background-color: rgba(0, 0, 0, 0.7); 
      display: none; justify-content: center; align-items: center; 
      z-index: 1000; 
    }
    .modal-content { 
      background-color: #f7edff; 
      padding: 25px; 
      border-radius: 0; 
      border: 4px solid #4b3b69; 
      text-align: center; 
      box-shadow: 8px 8px 0px #a68adf; 
      width: 90%; max-width: 400px; 
    }
    .modal-content p { 
      font-size: 14px; 
      margin-bottom: 25px; 
      line-height: 1.5; 
      color: #4a395f; 
    }

    .modal-buttons button { 
      padding: 15px 20px; 
      display: block; 
      width: 100%; 
      margin: 0 0 10px 0; 
      font-size: 10px; 
    }

    #confirm-btn { 
      background-color: #b58cff; 
      color: #22172b;
    }
    #confirm-btn:hover, #confirm-btn:active { 
      background-color: #d0b4ff; 
      color: #22172b; 
    }

    #cancel-btn { 
      background-color: #e0c4ff; 
      color: #22172b;
    }
    #cancel-btn:hover, #cancel-btn:active { 
      background-color: #f0ddff; 
      color: #22172b; 
    }

    @media (max-width: 500px) {
      .container { width: 85%; padding: 15px; }
      h1 { font-size: 18px; }
      button { padding: 10px 15px; font-size: 11px; }
      #code-message-area { font-size: 12px; min-height: 80px; }
      .modal-content { padding: 20px; max-width: 90%; }
    }
  </style>
</head>
<body>
  <div id="input-container" class="container">
    <h1>For Chelsea</h1>
    <p>Please enter your name</p>
    <input type="text" id="name-input" placeholder="e.g.Chelsea, Capitalize the first letter">
    <button onclick="showMessage()">see message</button>
  </div>

  <div id="result-container" class="container">
    <p>Message for you:</p>
    <pre id="code-message-area"></pre>
    <button onclick="resetToStart()">Best regards !</button>
  </div>

  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-content">
      <p id="confirmation-text">This is a confirmation message</p>
      <div class="modal-buttons">
        <button id="confirm-btn" onclick="confirmName()">I've checked it out.</button>
        <button id="cancel-btn" onclick="cancelConfirmation()">My bad. Let me start over.</button>
      </div>
    </div>
  </div>

  <script defer>
    const messages = {
      'Chelsea': `您好呀秋西早安呀
一個不小心我就要從這裡畢業了餒
整個環節其實就是很誤打誤撞，但是既然都發生了就只好先跟大家說掰掰咧 !

回想起來，來AY的第一年好像一個月還是兩個月之後，就變成妳管理上載，這邊不得不說，很抱歉讓妳管到了一個很粗心很皮很壞動作很慢的我，到後來妳要接新的東西，要換我管理上載team，那一次Appraisal在公司旁邊的星巴克，一直到那一次我才終於了解妳很辛苦(之前我就一直在皮)，突然聽妳講了很多管理的方法、遇到哪一些困難、遇到不能溝通的事情怎麼辦(阿雖然說上載team不久就團滅了)，還好PP跟月負荷數總是在亂算然後都達標，耶嘿。
真的很開心最後我們還是可以一起耍白癡，我覺得自己很幸運遇到妳跟Ariel喔!

來，以下:
Q: 當週有兩天上班日，建了17間旅宿，試問當月的月負荷數為多少?

1) 先換算成一天建立8.5間旅宿
2) 再換算成一週五天的工作量 -> 8.5*5 = 42.5
3) 42.5/2.5(當週的PP)*4(當月有幾週) = 68
A: 當月月負荷數為68
但是怎麼樣呢? 截至2023 Q1三月的目標是"上載物件數目標 360 間，平均每人月負荷 90 間"(神經病==)，所以是沒有達標的呦(格子要放紅色)

2023.04.26(筆記本寫的)，談了調薪然後我結果沒有調到薪爛公司哈哈哈哈，謝謝那段時間有一起瞎忙到的我們 !

我會很懷念這一年坐在隔壁一起上班，雖然妳就是很常很認真很忙沒有空理我，但我自己也是玩得很開心，能夠接到妳隨便亂丟出來的梗是我一生的榮幸!

P.S.中午要記得吃飯，以後星期四晚上地方媽媽想放風還是可以找我ㄛ`
    };

    let currentName = '';
    let typingInterval = null;

    document.addEventListener('DOMContentLoaded', () => {
      inputContainer = document.getElementById('input-container');
      nameInput = document.getElementById('name-input');
      modalOverlay = document.getElementById('modal-overlay');
      confirmationText = document.getElementById('confirmation-text');
      resultContainer = document.getElementById('result-container');
      codeMessageArea = document.getElementById('code-message-area');
    });

    function showMessage() {
      currentName = nameInput.value;
      if (currentName.trim() === '') { alert('Please enter your name first！'); return; }
      confirmationText.innerText = `Are you sure you are "${currentName}" ?`;
      modalOverlay.style.display = 'flex';
    }

    function cancelConfirmation() {
      modalOverlay.style.display = 'none';
    }

    function confirmName() {
      modalOverlay.style.display = 'none';
      const messageToShow = (currentName in messages) ? messages[currentName] : `Who are you ${currentName}? No message for you.`;
      codeMessageArea.innerHTML = '';
      typeMessage(messageToShow, codeMessageArea);
      inputContainer.style.display = 'none';
      resultContainer.style.display = 'block';
    }

    function typeMessage(message, element) {
      if (typingInterval) { clearInterval(typingInterval); typingInterval = null; }
      let index = 0;
      element.innerHTML = '<span class="typing-cursor"></span>';
      typingInterval = setInterval(() => {
        if (index < message.length) {
          const cursorSpan = element.querySelector('.typing-cursor');
          const charNode = document.createTextNode(message[index]);
          if (cursorSpan) element.insertBefore(charNode, cursorSpan);
          element.scrollTop = element.scrollHeight;
          index++;
        } else {
          clearInterval(typingInterval);
          typingInterval = null;
          element.querySelector('.typing-cursor').remove();
        }
      }, 80);
    }

    function resetToStart() {
      if (typingInterval) { clearInterval(typingInterval); typingInterval = null; }
      resultContainer.style.display = 'none';
      inputContainer.style.display = 'block';
      nameInput.value = '';
      codeMessageArea.innerHTML = '';
    }
  </script>
</body>
</html>
